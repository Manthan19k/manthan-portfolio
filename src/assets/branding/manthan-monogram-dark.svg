  <polygon class="m-slope m-slope-right" points="184,25 144,25 120,96 138,120 184,40" fill="#FFFFFF" stroke="rgba(255,255,255,0.2)" stroke-width="0.8" />
  <polygon class="m-orange m-orange-left" filter="url(#m-dark-shadow)" points="56,25 74,25 120,146 108,160 56,62" fill="#F07A16" />
  <polygon class="m-orange m-orange-right" filter="url(#m-dark-shadow)" points="184,25 166,25 120,146 132,160 184,62" fill="#FF9E4A" />
  <polygon class="m-keystone" filter="url(#m-dark-glow)" points="120,116 138,144 120,166 102,144" fill="#F5EFE6" stroke="#F07A16" stroke-width="1.5" />
