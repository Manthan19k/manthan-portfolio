      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="m-dark-glow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F07A16" flood-opacity="0.45" />
    </filter>
  </defs>

  <g class="m-crosshairs" stroke="#F07A16" stroke-width="1.2" opacity="0.85">
