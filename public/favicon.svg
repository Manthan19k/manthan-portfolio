<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <style>
    .pillar { fill: #171513; }
    .valley { fill: #2A2520; }
    .slope { fill: #FFFFFF; stroke: #171513; stroke-width: 1.5; }
    .orange-left { fill: #C95A08; }
    .orange-right { fill: #E06915; }
    .keystone { fill: #171513; stroke: #C95A08; stroke-width: 2; }
    .crosshairs { stroke: #C95A08; stroke-width: 1.5; opacity: 0.85; }

    @media (prefers-color-scheme: dark) {
      .pillar { fill: #F5EFE6; }
      .slope { stroke: rgba(255, 255, 255, 0.25); stroke-width: 1; }
      .orange-left { fill: #F07A16; }
      .orange-right { fill: #FF9E4A; }
      .keystone { fill: #F5EFE6; stroke: #F07A16; stroke-width: 2; }
      .crosshairs { stroke: #F07A16; }
    }
  </style>

  <g class="crosshairs">
    <line x1="12" y1="25" x2="20" y2="25" />
    <line x1="16" y1="21" x2="16" y2="29" />
    <line x1="220" y1="25" x2="228" y2="25" />
    <line x1="224" y1="21" x2="224" y2="29" />
    <line x1="12" y1="175" x2="20" y2="175" />
    <line x1="16" y1="171" x2="16" y2="179" />
    <line x1="220" y1="175" x2="228" y2="175" />
    <line x1="224" y1="171" x2="224" y2="179" />
  </g>

  <!-- Structural Outer Pillars -->
  <path class="pillar" d="M 24 25 L 56 25 L 56 175 L 24 175 Z" />
  <path class="pillar" d="M 184 25 L 216 25 L 216 175 L 184 175 Z" />

  <!-- Grounding Valley -->
  <polygon class="valley" points="56,175 120,132 184,175 162,175 120,146 78,175" />

  <!-- Faceted Chevrons -->
  <polygon class="slope" points="56,25 96,25 120,96 102,120 56,40" />
  <polygon class="slope" points="184,25 144,25 120,96 138,120 184,40" />

  <!-- Burnt Orange Diagonal Beams -->
  <polygon class="orange-left" points="56,25 74,25 120,146 108,160 56,62" />
  <polygon class="orange-right" points="184,25 166,25 120,146 132,160 184,62" />

  <!-- Central Interlocking Keystone -->
  <polygon class="keystone" points="120,116 138,144 120,166 102,144" />
</svg>
